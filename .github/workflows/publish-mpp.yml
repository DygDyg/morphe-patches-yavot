name: Publish mpp release

# Builds patches-*.mpp and attaches it to an existing tag release.
# Used when semantic-release creates the tag/commit but fails before uploading assets
# (for example when git notes are rejected).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish (for example v1.1.1)
        required: true
        default: v1.1.1

jobs:
  publish:
    name: Build and publish mpp
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout yavot at tag
        uses: actions/checkout@v7
        with:
          path: morphe-patches-yavot
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Checkout base morphe-patches
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches
          ref: v2.3.0
          path: morphe-patches

      - name: Checkout morphe-patcher
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patcher
          ref: v2.4.0
          path: morphe-patcher

      - name: Checkout morphe-patches-library
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches-library
          ref: v2.2.0
          path: morphe-patches-library

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Precompile base extension classes
        working-directory: morphe-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :extensions:youtube:compileReleaseKotlin \
                    :extensions:youtube:compileReleaseJavaWithJavac \
                    --no-daemon --stacktrace

      - name: Build patches bundle
        working-directory: morphe-patches-yavot
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # buildAndroid produces classes.dex (required by Morphe Manager on Android).
          ./gradlew :patches:buildAndroid generatePatchesList --no-daemon --stacktrace
          ls -la patches/build/libs/
          # Fail the job if the bundle is missing dex (Manager would show 0 patches).
          MPP=$(ls patches/build/libs/patches-*.mpp | grep -vE 'sources|javadoc' | head -n 1)
          jar tf "$MPP" | grep -qx 'classes.dex'

      - name: Create or update GitHub release
        working-directory: morphe-patches-yavot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          MPP=$(ls patches/build/libs/patches-*.mpp \
            | grep -vE 'sources|javadoc' \
            | head -n 1)
          test -n "$MPP"
          echo "Publishing $MPP"
          NOTES=$(sed -n "/## \\[${VERSION}\\]/,/^## \\[/p" CHANGELOG.md | sed '$d' || true)
          if [ -z "$NOTES" ]; then
            NOTES="Yandex VoT switch fix for Morphe Patches 2.3.0+"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$MPP" --clobber
          else
            gh release create "$TAG" "$MPP" --title "$TAG" --notes "$NOTES"
          fi
          gh release view "$TAG"
